<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#07090f">
<title>Barcode by aLeMaX</title>
<style>
:root{
  --bg:#07090f;--bg2:#0d1119;--surf:#131824;--surf2:#1b2234;--line:#262f45;
  --tx:#eef1f8;--mut:#8b95ab;--a1:#7557ff;--a2:#2f8bff;--cy:#22d3ee;--danger:#ff7a8d;
  --grad:linear-gradient(135deg,var(--a1),var(--a2));
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0}
body{
  display:flex;flex-direction:column;height:100dvh;overflow:hidden;overscroll-behavior:none;
  background:
    radial-gradient(900px 480px at 85% -8%,#1c1446 0,transparent 62%),
    radial-gradient(700px 420px at -10% 108%,#062f3b 0,transparent 58%),
    var(--bg);
  color:var(--tx);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  -webkit-user-select:none;user-select:none;
}
input,textarea{-webkit-user-select:text;user-select:text}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer;touch-action:manipulation}
.i{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round;flex:none}

/* ---------- Header ---------- */
.top{display:flex;align-items:center;justify-content:space-between;
  padding:calc(env(safe-area-inset-top,0px) + 12px) 18px 6px}
.brand{display:flex;align-items:center;gap:12px}
.logo{width:40px;height:40px;border-radius:13px;background:var(--grad);display:grid;place-items:center;
  box-shadow:0 6px 20px -4px rgba(117,87,255,.6)}
.logo .i{color:#fff}
.brand b{display:block;font-size:17px;letter-spacing:.2px}
.brand small{display:block;font-size:12px;font-weight:600;
  background:linear-gradient(90deg,#a99bff,var(--cy));-webkit-background-clip:text;background-clip:text;color:transparent}
.pill{font-size:12px;font-weight:600;color:var(--cy);background:rgba(34,211,238,.1);
  border:1px solid rgba(34,211,238,.25);padding:6px 12px;border-radius:99px}
.pill:empty{display:none}

/* ---------- Stage ---------- */
#stage{flex:1;min-height:0;overflow-y:auto;padding:6px 16px 16px;display:flex;flex-direction:column;scrollbar-width:none}
#stage::-webkit-scrollbar{display:none}
.wrap{margin-block:auto;display:flex;flex-direction:column;gap:14px}
#out{display:flex;flex-direction:column;gap:16px}
#err{display:none;color:var(--danger);background:rgba(255,122,141,.1);border:1px solid rgba(255,122,141,.3);
  border-radius:14px;padding:10px 14px;font-size:13px}
.bc{position:relative;background:#fff;border-radius:22px;padding:16px 14px 14px;
  box-shadow:0 18px 50px -14px rgba(117,87,255,.55),0 0 0 1px rgba(255,255,255,.08)}
.bc canvas{display:block;width:100%;height:auto}
.bc .idx{position:absolute;top:8px;left:12px;font-size:11px;font-weight:700;color:#7a86a0}
.bc .cap{margin-top:8px;text-align:center;font-size:12px;color:#7a86a0}
.bc .cacts{display:flex;gap:8px;margin-top:12px}
.bc .cacts button{flex:1;height:48px;border-radius:14px;background:#eef1f8;color:#10141d;font-weight:700;font-size:14px;
  display:flex;align-items:center;justify-content:center;gap:8px}
.bc .cacts button:active{background:#dfe4f0}
.empty{text-align:center;color:var(--mut);padding:24px 20px}
.empty .art{width:96px;height:96px;margin:0 auto 18px;border-radius:30px;display:grid;place-items:center;
  background:linear-gradient(135deg,rgba(117,87,255,.18),rgba(47,139,255,.1));border:1px solid var(--line)}
.empty .art .i{width:46px;height:46px;color:#a99bff;stroke-width:1.5}
.empty h2{margin:0 0 6px;font-size:18px;color:var(--tx)}
.empty p{margin:0;font-size:14px;line-height:1.5}

/* ---------- History ---------- */
#histv{flex:1}
.hrow{display:flex;align-items:center;gap:6px;background:var(--surf);border:1px solid var(--line);
  border-radius:18px;margin-bottom:10px;padding:4px 4px 4px 4px}
.hrow .open{flex:1;min-width:0;display:flex;align-items:center;gap:12px;text-align:left;padding:10px;border-radius:14px;min-height:60px}
.hrow .open:active{background:var(--surf2)}
.hrow .ico{width:40px;height:40px;border-radius:12px;background:var(--surf2);display:grid;place-items:center;color:#a99bff;flex:none}
.hrow .tx{min-width:0}
.hrow .tx b{display:block;font-size:16px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.hrow .tx small{color:var(--mut);font-size:12px}
.hrow .del{width:52px;height:52px;border-radius:14px;display:grid;place-items:center;color:var(--mut)}
.hrow .del:active{background:rgba(255,122,141,.15);color:var(--danger)}
.clrall{width:100%;height:52px;border-radius:16px;border:1px solid rgba(255,122,141,.35);color:var(--danger);font-weight:600;margin-top:6px}

/* ---------- Dock (bawah, terjangkau ibu jari) ---------- */
.dock{background:rgba(13,17,25,.92);-webkit-backdrop-filter:blur(16px);backdrop-filter:blur(16px);
  border-top:1px solid var(--line);border-radius:26px 26px 0 0;padding:14px 14px 0;
  box-shadow:0 -12px 40px rgba(0,0,0,.45)}
.hint{font-size:12px;color:var(--mut);margin:0 4px 8px}
.typerow{display:flex;align-items:center;gap:10px;margin:0 0 8px}
.typerow .hint{margin:0;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;text-align:right}
.chip{display:flex;align-items:center;gap:8px;height:44px;padding:0 12px 0 14px;border-radius:99px;flex:none;max-width:62%;
  background:var(--surf);border:1px solid var(--line);color:var(--tx);font-weight:700;font-size:14px}
.chip span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.chip .i{width:18px;height:18px;color:#a99bff}
.chip:active{background:var(--surf2)}
#tsheet .panel{max-height:84dvh;display:flex;flex-direction:column}
.tsearch{display:flex;align-items:center;gap:10px;background:var(--surf);border:1.5px solid var(--line);border-radius:16px;
  padding:0 14px;height:50px;margin:4px 0 6px;color:var(--mut)}
.tsearch:focus-within{border-color:var(--a1)}
.tsearch input{flex:1;min-width:0;background:transparent;border:0;outline:0;color:var(--tx);font-size:16px;font-family:inherit}
.tlist{overflow-y:auto;margin:0 -20px;padding:0 20px 8px;flex:1;min-height:0}
.tg{font-size:12px;font-weight:700;letter-spacing:.6px;color:var(--cy);text-transform:uppercase;margin:14px 2px 6px}
.trow{display:flex;align-items:center;gap:2px;border-radius:16px;margin-bottom:4px}
.trow.on{background:rgba(117,87,255,.18)}
.trow .sel{flex:1;min-width:0;text-align:left;padding:10px 12px;min-height:60px;border-radius:16px;display:flex;flex-direction:column;justify-content:center;gap:2px}
.trow .sel:active{background:var(--surf2)}
.trow .sel b{font-size:16px}
.trow .sel small{color:var(--mut);font-size:12px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.trow .st{width:54px;height:54px;display:grid;place-items:center;color:#5d677d;border-radius:14px;flex:none}
.trow .st.def{color:#ffd24a}
.trow .st.def .i{fill:#ffd24a}
.badge{font-size:10px;font-weight:700;color:#ffd24a;background:rgba(255,210,74,.12);border-radius:99px;padding:2px 8px;margin-left:8px;vertical-align:middle}
.field{display:flex;align-items:flex-end;gap:6px;background:var(--surf);border:1.5px solid var(--line);
  border-radius:18px;padding:0 6px 0 16px;min-height:58px;transition:border-color .15s,box-shadow .15s}
.field:focus-within{border-color:var(--a1);box-shadow:0 0 0 4px rgba(117,87,255,.18)}
.field input,.field textarea{flex:1;min-width:0;background:transparent;border:0;outline:0;color:var(--tx);
  font:inherit;font-size:18px;padding:16px 0;resize:none}
.field textarea{max-height:120px;line-height:1.35}
.field input::placeholder,.field textarea::placeholder{color:#5d677d}
.field .x{width:46px;height:46px;margin-bottom:6px;border-radius:14px;display:grid;place-items:center;color:var(--mut);flex:none}
.field .x:active{background:var(--surf2)}
.acts{display:flex;gap:8px;margin-top:10px}
.primary{flex:1;min-width:0;white-space:nowrap;height:58px;border-radius:18px;background:var(--grad);color:#fff;font-weight:700;font-size:16.5px;
  display:flex;align-items:center;justify-content:center;gap:10px;
  box-shadow:0 10px 26px -8px rgba(117,87,255,.8)}
.primary:active{transform:scale(.98);filter:brightness(1.1)}
.ib{width:58px;flex:none;height:58px;border-radius:18px;background:var(--surf);border:1px solid var(--line);
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-size:10.5px;color:#c9d0e0;font-weight:600}
.ib .i{width:21px;height:21px}
.ib:active{background:var(--surf2)}
.nav{display:grid;grid-template-columns:repeat(3,1fr);margin-top:8px;padding-bottom:calc(env(safe-area-inset-bottom,0px) + 6px)}
.nav button{display:flex;flex-direction:column;align-items:center;gap:4px;padding:6px 0 4px;font-size:12px;font-weight:600;color:var(--mut)}
.nav .pl{width:62px;height:32px;border-radius:99px;display:grid;place-items:center;transition:background .18s}
.nav button.on{color:#fff}
.nav button.on .pl{background:rgba(117,87,255,.28);color:#c9bfff}

/* mode switching */
body[data-mode=hist] .compose{display:none}
body[data-mode=hist] #out{display:none}
body:not([data-mode=hist]) #histv{display:none}
body[data-mode=batch] #t{display:none}
body:not([data-mode=batch]) #b{display:none}
body:not([data-mode=batch]) .only-batch{display:none}

/* ---------- Sheet ---------- */
.sheet{position:fixed;inset:0;z-index:20;visibility:hidden}
.sheet .scrim{position:absolute;inset:0;background:rgba(0,0,0,.55);opacity:0;transition:opacity .2s}
.sheet .panel{position:absolute;left:0;right:0;bottom:0;background:var(--bg2);border-top:1px solid var(--line);
  border-radius:28px 28px 0 0;padding:10px 20px calc(env(safe-area-inset-bottom,0px) + 20px);
  transform:translateY(100%);transition:transform .25s cubic-bezier(.2,.8,.2,1)}
.sheet.open{visibility:visible}
.sheet.open .scrim{opacity:1}
.sheet.open .panel{transform:none}
.grab{width:44px;height:5px;border-radius:9px;background:var(--line);margin:0 auto 14px}
.panel h3{margin:0 0 8px;font-size:18px}
.slh{display:flex;justify-content:space-between;color:var(--mut);font-size:14px;margin-top:10px}
.slh b{color:var(--tx)}
input[type=range]{-webkit-appearance:none;appearance:none;width:100%;height:48px;background:transparent;margin:0}
input[type=range]::-webkit-slider-runnable-track{height:8px;border-radius:99px;
  background:linear-gradient(90deg,var(--a1) var(--p,50%),var(--surf2) var(--p,50%))}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:30px;height:30px;border-radius:50%;background:#fff;
  margin-top:-11px;box-shadow:0 2px 10px rgba(0,0,0,.5)}
.panel .primary{width:100%;flex:none;margin-top:10px}

/* toast */
#toast{position:fixed;left:50%;transform:translateX(-50%) translateY(10px);opacity:0;pointer-events:none;z-index:30;
  background:#222a3d;border:1px solid var(--line);color:#fff;padding:12px 18px;border-radius:99px;font-size:14px;font-weight:600;
  max-width:92%;text-align:center;box-shadow:0 10px 30px rgba(0,0,0,.5);transition:opacity .2s,transform .2s}
#toast.show{opacity:1;transform:translateX(-50%)}

/* ===== v2 ===== */
.dock{position:relative}
.handle{display:grid;place-items:center;width:100%;height:22px;margin:-8px 0 4px}
.handle span{width:42px;height:5px;border-radius:9px;background:var(--line)}
.dock.min .field,.dock.min .acts{display:none}
.field textarea{max-height:84px}
.primary,.ib{min-width:0}
.primary span{overflow:hidden;text-overflow:ellipsis}
.ib{width:auto;min-width:58px;padding:0 6px}
.ib span{max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
body[data-mode=batch] .acts{flex-wrap:wrap}
body[data-mode=batch] .primary{flex:1 1 100%}
body[data-mode=batch] .ib{flex:1 1 0;flex-direction:row;gap:8px;height:50px;font-size:13px;padding:0 8px}
.trow .sel,.hrow .open,.row{text-align:start}
.typerow .hint{text-align:end}
.bc .idx{left:auto;inset-inline-start:14px}
.hint{line-height:1.45}

/* pratinjau */
#out{display:flex;flex-direction:column;gap:16px}
body[data-mode=single][data-pv=med] .bc{width:78%;margin:0 auto}
body[data-mode=single][data-pv=small] .bc{width:56%;margin:0 auto}
body[data-mode=single][data-pv=small] .bc .cacts{display:none}
body[data-mode=batch][data-pv=med] .bc canvas{width:72%;margin:0 auto}
body[data-mode=batch][data-pv=small] #out{display:grid;grid-template-columns:1fr 1fr;gap:10px}
body[data-mode=batch][data-pv=small] .bc{padding:14px 8px 8px;border-radius:16px}
body[data-mode=batch][data-pv=small] .bc .cacts,body[data-mode=batch][data-pv=small] .bc .cap{display:none}
body[data-mode=batch][data-pv=list] #out{gap:8px}
.bc.row-l{display:flex;align-items:center;gap:10px;padding:8px 8px 8px 12px;border-radius:16px;box-shadow:none}
.bc.row-l .lt{flex:1;min-width:0;color:#10141d}
.bc.row-l .lt small{display:block;font-size:11px;font-weight:700;color:#7a86a0}
.bc.row-l .lt b{display:block;font-size:15px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.bc.row-l canvas{width:auto;height:46px;max-width:44%}
.bc .rm{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;color:#7a86a0;flex:none}
.bc .rm:active{background:#eef1f8}
.bc{cursor:pointer}
.bc.dup{outline:2px solid var(--danger)}

/* pengaturan */
.panel.scroll{max-height:88dvh;overflow-y:auto}
.sec{font-size:12px;font-weight:700;letter-spacing:.6px;color:var(--cy);text-transform:uppercase;margin:18px 2px 4px}
.lbl{font-size:14px;color:var(--mut);margin:10px 2px 6px}
.seg{display:flex;gap:6px;flex-wrap:wrap}
.seg button{flex:1 1 0;min-width:calc(25% - 6px);padding:8px 4px;border-radius:14px;background:var(--surf);border:1.5px solid var(--line);
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;min-height:54px;font-size:14px}
.seg button b{font-weight:700;text-align:center}
.seg button small{font-weight:500;font-size:11px;color:var(--mut);text-align:center}
.seg button.on{border-color:var(--a1);background:rgba(117,87,255,.22)}
.seg.two button{min-width:calc(50% - 6px)}
.row{display:flex;align-items:center;gap:12px;width:100%;min-height:58px;padding:0 14px;border-radius:16px;background:var(--surf);
  border:1px solid var(--line);margin-top:8px;font-size:16px}
.row>span:first-of-type{flex:1;min-width:0}
.row small{color:var(--mut);font-size:13px;max-width:45%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.row .i{color:#a99bff}
.sw{position:relative;width:52px;height:30px;border-radius:99px;background:var(--surf2);flex:none;transition:background .2s}
.sw::after{content:"";position:absolute;top:3px;inset-inline-start:3px;width:24px;height:24px;border-radius:50%;background:#fff;transition:transform .2s}
.sw.on{background:var(--a1)}
.sw.on::after{transform:translateX(22px)}
[dir=rtl] .sw.on::after{transform:translateX(-22px)}
[dir=rtl] .row .i[style*="i-next"]{transform:scaleX(-1)}

/* bahasa */
.lrow{display:flex;align-items:center;gap:10px;width:100%;min-height:54px;padding:0 14px;border-radius:14px;margin-bottom:4px;font-size:16px;text-align:start}
.lrow span{flex:1;min-width:0}
.lrow small{color:var(--mut);font-size:12px}
.lrow:active{background:var(--surf2)}
.lrow.on{background:rgba(117,87,255,.2)}
.lrow .i{color:#a99bff;width:20px;height:20px}
#lsheet .panel{max-height:84dvh;display:flex;flex-direction:column}

/* tentang */
.ab h2{text-align:center;margin:0;font-size:20px}
.ab .role{text-align:center;color:var(--cy);font-size:13px;font-weight:600;margin:3px 0 12px}
.av{display:block;width:108px;height:108px;margin:4px auto 12px;border-radius:50%;object-fit:cover;
  border:3px solid rgba(117,87,255,.7);box-shadow:0 12px 34px -8px rgba(117,87,255,.75)}
.kv{display:flex;justify-content:space-between;align-items:baseline;gap:14px;padding:12px 2px;border-bottom:1px solid var(--line);font-size:14px}
.kv span{color:var(--mut);flex:none}
.kv a,.kv b{color:var(--tx);text-align:end;min-width:0;overflow-wrap:anywhere;font-weight:600}
.kv a{color:#9db7ff;text-decoration:none}

/* layar penuh */
.viewer{position:fixed;inset:0;z-index:40;display:none;flex-direction:column;background:rgba(5,7,12,.97);
  padding:calc(env(safe-area-inset-top,0px) + 14px) 14px calc(env(safe-area-inset-bottom,0px) + 14px)}
.viewer.open{display:flex}
.vbox{flex:1;min-height:0;display:grid;place-items:center;overflow:auto}
.vcard{background:#fff;border-radius:22px;padding:14px;width:100%}
.vcard canvas{display:block;width:100%;height:auto;max-height:72dvh;object-fit:contain}
.vact{display:flex;gap:8px;margin-top:12px}
.vact .primary{flex:1.4}
.vact .ib{flex:1;flex-direction:row;gap:8px}
#toast{z-index:60}
.bc.sm .idx,body[data-pv=small] .bc .idx{top:4px;font-size:9px}

.pill{max-width:62%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
</style>
</head>
<body data-mode="single" data-pv="big">

  <symbol id="i-check" viewBox="0 0 24 24"><path d="M5 12.5l4.5 4.5L19 7.5"/></symbol>
  <symbol id="i-next" viewBox="0 0 24 24"><path d="M9 6l6 6-6 6"/></symbol>
</svg>

<header class="top">
  <div class="brand">
    <div class="logo"><svg class="i"><use href="#i-bar"/></svg></div>
    <div><b>Barcode</b><small>by aLeMaX</small></div>
  </div>
  <div class="pill" id="cnt"></div>
</header>

<section id="stage">

function encode(s){
  for(const ch of s){const c=ch.charCodeAt(0);if(c<32||c>126)throw new Error("Karakter tidak didukung: "+ch);}
  const codes=[];let mode=null;let i=0;
  const digRun=p=>{let n=0;while(p+n<s.length&&s[p+n]>="0"&&s[p+n]<="9")n++;return n;};
  while(i<s.length){
    const run=digRun(i);
    const useC=run>=4||(run>=2&&run===s.length-i&&i===0);
    if(useC){
      if(mode===null)codes.push(105);else if(mode!=="C")codes.push(99);
      mode="C";
      const n=run-(run%2);
      for(let k=0;k<n;k+=2)codes.push(parseInt(s.substr(i+k,2),10));
      i+=n;
    }else{
      if(mode===null)codes.push(104);else if(mode!=="B")codes.push(100);
      mode="B";
      codes.push(s.charCodeAt(i)-32);i++;
    }
  }
  let sum=codes[0];
  for(let k=1;k<codes.length;k++)sum+=codes[k]*k;
  codes.push(sum%103,106);
  return codes;
}

/* ---------- Penggambar ---------- */
const WM="by aLeMaX";
const wmOn=()=>cfg.wm!==false;
// k = pengali ukuran (1 = pratinjau; >1 untuk simpan HD/4K, digambar ulang agar tetap tajam)
function drawCode128(cv,s,k){
  k=k||1;
  const m0=+$("w").value,mod=m0*k,bh=(+$("h").value)*k,quiet=10*mod,fs=(18+m0*2)*k;
  const codes=encode(s);
  const pat=codes.map(c=>P[c]).join("");
  let total=0;for(const d of pat)total+=+d;
  const wf=(10+m0*2)*k,wm=wmOn();
  const W=total*mod+quiet*2,H=bh+fs+24*k+(wm?wf+10*k:0);
  cv.width=W;cv.height=H;
  const ctx=cv.getContext("2d");
  ctx.fillStyle="#fff";ctx.fillRect(0,0,W,H);
  ctx.fillStyle="#000";
  let x=quiet,bar=true;
  for(const d of pat){const w=+d*mod;if(bar)ctx.fillRect(x,8*k,w,bh);x+=w;bar=!bar;}
  ctx.font=fs+"px monospace";ctx.textAlign="center";
  ctx.fillText(s,W/2,bh+8*k+fs+4*k,W-10*k);
  if(wm){ctx.font="italic "+wf+"px sans-serif";ctx.fillStyle="#666";ctx.fillText(WM,W/2,H-8*k);}
}
const bwipReady=()=>!!(window.bwipjs&&typeof window.bwipjs.toCanvas==="function");
async function drawBwip(cv,s,k){
  k=k||1;
  if(!bwipReady()){const e=new Error("NOLIB");e.nolib=true;throw e;}
  const t=curType,sc=+$("w").value,bh=+$("h").value,two=t.d==="2d";
  const scale=(two?sc*3:sc)*k;
  const o={bcid:t.id,text:t.prep?t.prep(s):s,scale:scale,paddingwidth:10,paddingheight:10,backgroundcolor:"FFFFFF"};
  if(!two&&!t.nh)o.height=Math.max(4,bh*25.4/(72*(two?sc*3:sc)));
  if(!two&&!t.nt){o.includetext=true;o.textxalign="center";}
  const tmp=document.createElement("canvas");
  let r=window.bwipjs.toCanvas(tmp,o);
  if(r&&typeof r.then==="function")r=await r;
  const src=(r&&r.getContext)?r:tmp;
  const wm=wmOn(),wf=Math.max(12,Math.round(src.width/24));
  const W=src.width,H=src.height+(wm?wf+Math.round(14*k):0);
  cv.width=W;cv.height=H;
  const ctx=cv.getContext("2d");
  ctx.fillStyle="#fff";ctx.fillRect(0,0,W,H);
  ctx.drawImage(src,0,0);
  if(wm){ctx.font="italic "+wf+"px sans-serif";ctx.fillStyle="#666";ctx.textAlign="center";ctx.fillText(WM,W/2,H-Math.round(8*k));}
}
function drawTo(cv,s,k){return curType.own?Promise.resolve(drawCode128(cv,s,k)):drawBwip(cv,s,k);}
function errText(e){
  if(e&&e.nolib)return tr("err_nolib");
  let m=String((e&&e.message)||e||"");
  const i=m.indexOf(": ");
  if(/^bwipp\./.test(m)&&i>0)m=m.slice(i+2);
  return m.slice(0,140);
}

function seq(){

  return String(n).padStart(3,"0");

  t.textContent=msg;t.style.bottom=($("dock").offsetHeight+16)+"px";t.classList.add("show");

const NP=()=>(window.Capacitor&&window.Capacitor.Plugins)||{};
function toB64(b){return new Promise((res,rej)=>{const f=new FileReader();f.onload=()=>res(String(f.result).split(",")[1]);f.onerror=rej;f.readAsDataURL(b);});}
async function writeImage(b,name){
  const pl=NP();
  if(pl.MediaSaver){
    try{await pl.MediaSaver.save({data:await toB64(b),name:name,mime:mime()});return true;}
    catch(e){toast(tr("t_fail",{e:(e&&e.message)||e}));return false;}
  }
  const a=document.createElement("a");
  a.href=URL.createObjectURL(b);a.download=name;
  document.body.appendChild(a);a.click();a.remove();
  setTimeout(()=>URL.revokeObjectURL(a.href),4000);
  return true;
}
// Kualitas: digambar ulang dengan pengali bulat k agar tetap tajam
const QW={std:0,hd:1280,fhd:1920,uhd:3840},MAXPX=26e6;
function kFor(w,h,ref){
  const tw=QW[cfg.q];if(!tw)return 1;
  let k=Math.max(1,Math.round(tw/ref));
  while(k>1&&(w*k)*(h*k)>MAXPX)k--;
  return k;
}
async function hiCanvas(it,k){
  if(k<=1)return it.canvas;
  const cv=document.createElement("canvas");await drawTo(cv,it.text,k);return cv;
}
async function saveList(list){
  if(!list.length){toast(tr("t_fill"));return;}
  let ok=0;
  for(const it of list){
    const cv=await hiCanvas(it,kFor(it.canvas.width,it.canvas.height,it.canvas.width));
    if(await writeImage(await blobOf(cv),seq()+"_"+fkey(curType)+"_"+safe(it.text)+"."+ext()))ok++;
    if(!NP().MediaSaver&&list.length>1)await delay(350);
  }
  if(ok){toast(tr(NP().MediaSaver?"t_saved":"t_dl",{n:ok}));addHist();}
}
async function mergeSave(){
  if(!items.length){toast(tr("t_fill"));return;}
  const tw=QW[cfg.q],ref=Math.max.apply(null,items.map(i=>i.canvas.width));
  let k=tw?Math.max(1,Math.round(tw/ref)):1,lowered=false,c;
  for(;;){
    const cvs=[];for(const it of items)cvs.push(await hiCanvas(it,k));
    const pad=16*k,gap=24*k;
    const W=Math.max.apply(null,cvs.map(x=>x.width))+pad*2;
    const H=cvs.reduce((a,x)=>a+x.height+gap,pad*2-gap);
    if(W*H>MAXPX&&k>1){k=Math.max(1,Math.floor(k*Math.sqrt(MAXPX/(W*H))));lowered=true;continue;}
    c=document.createElement("canvas");c.width=W;c.height=H;
    const ctx=c.getContext("2d");ctx.fillStyle="#fff";ctx.fillRect(0,0,W,H);
    let y=pad;cvs.forEach(x=>{ctx.drawImage(x,Math.round((W-x.width)/2),y);y+=x.height+gap;});
    break;
  }
  if(await writeImage(await blobOf(c),seq()+"_"+fkey(curType)+"_batch"+items.length+"."+ext())){
    toast(tr("t_merged")+(lowered?" · "+tr("t_lower"):""));addHist();
  }
}
async function shareFiles(list){
  if(!list.length){toast(tr("t_fill"));return;}
  const blobs=[];
  for(const it of list){
    const cv=await hiCanvas(it,kFor(it.canvas.width,it.canvas.height,it.canvas.width));
    blobs.push(await blobOf(cv));
  }
  const pl=NP();
  if(pl.Share&&pl.Filesystem){
    try{
      const uris=[];
      for(let k=0;k<list.length;k++){
        const r=await pl.Filesystem.writeFile({path:"share_"+(k+1)+"_"+safe(list[k].text)+"."+ext(),data:await toB64(blobs[k]),directory:"CACHE"});
        uris.push(r.uri);
      }
      await pl.Share.share({title:"Barcode by aLeMaX",files:uris});addHist();
    }catch(e){if(!/cancel/i.test(String((e&&e.message)||e)))toast(tr("t_fail",{e:(e&&e.message)||e}));}
    return;
  }
  const files=list.map((it,k)=>new File([blobs[k]],safe(it.text)+"."+ext(),{type:mime()}));
  try{
    if(navigator.canShare&&navigator.canShare({files}))await navigator.share({files:files,title:"Barcode by aLeMaX"});
    else if(navigator.share)await navigator.share({title:"Barcode by aLeMaX",text:list.map(i=>i.text).join(", ")});
    else{toast(tr("t_noshare"));return;}
    addHist();
  }catch(e){}
}

/* ---------- Tampilan ---------- */
function btn(label,icon,fn){
  const b=document.createElement("button");
  b.innerHTML='<svg class="i" style="width:18px;height:18px"><use href="#'+icon+'"/></svg>';
  b.append(label);b.onclick=e=>{e.stopPropagation();tap();fn();};return b;
}
function emptyEl(){
  const d=document.createElement("div");d.className="empty";
  d.innerHTML='<div class="art"><svg class="i"><use href="#i-bar"/></svg></div><h2></h2><p></p>';
  d.querySelector("h2").textContent=tr(isBatch()?"empty_t_batch":"empty_t_single");
  d.querySelector("p").textContent=tr(isBatch()?(curType.d==="2d"?"empty_p_batch2":"empty_p_batch1"):"empty_p_single");
  return d;
}
let vItem=null;
function openViewer(it){
  vItem=it;tap();
  const c=document.createElement("canvas");c.width=it.canvas.width;c.height=it.canvas.height;
  c.getContext("2d").drawImage(it.canvas,0,0);
  $("vcard").innerHTML="";$("vcard").appendChild(c);$("viewer").classList.add("open");
}
function removeToken(text){
  const a=splitBatch($("b").value).filter(x=>x!==text);
  $("b").value=a.join(curType.d==="2d"?"\n":" ");grow();render();
}
let rTok=0;
async function render(){
  const tok=++rTok;
  const pw=(+$("w").value-1)/5*100,ph=(+$("h").value-60)/240*100;
  $("w").style.setProperty("--p",pw+"%");$("h").style.setProperty("--p",ph+"%");
  $("wv").textContent=$("w").value;$("hv").textContent=$("h").value;
  const pv=isBatch()?cfg.pv:(cfg.pv==="list"?"big":cfg.pv);
  document.body.dataset.pv=pv;
  const raw=isBatch()?$("b").value:$("t").value;
  const list=isBatch()?parseBatch(raw):(raw?[raw]:[]);
  const dups=isBatch()?parseBatch.dups:0;
  const made=[],bad=[];let lastErr=null;
  for(const s of list){
    const cv=document.createElement("canvas");
    try{await drawTo(cv,s);made.push({text:s,canvas:cv});}catch(e){bad.push(s);lastErr=e;}
    if(tok!==rTok)return;
  }
  if(mode==="hist")return;
  items=made;
  const out=$("out");out.innerHTML="";$("err").style.display="none";
  made.forEach((it,k)=>{
    const card=document.createElement("div");
    if(pv==="list"&&isBatch()){
      card.className="bc row-l";
      const lt=document.createElement("div");lt.className="lt";lt.innerHTML="<small></small><b></b>";
      lt.firstChild.textContent="#"+(k+1);lt.lastChild.textContent=it.text;
      const rm=document.createElement("button");rm.className="rm";rm.innerHTML='<svg class="i"><use href="#i-x"/></svg>';
      rm.onclick=e=>{e.stopPropagation();tap();removeToken(it.text);};
      card.append(lt,it.canvas,rm);
    }else{
      card.className="bc";
      if(isBatch()){const ix=document.createElement("div");ix.className="idx";ix.textContent="#"+(k+1);card.appendChild(ix);}
      card.appendChild(it.canvas);
      if(isBatch()){
        const ac=document.createElement("div");ac.className="cacts";
        ac.append(btn(tr("save"),"i-dl",()=>saveList([it])),btn(tr("share"),"i-share",()=>shareFiles([it])));
        card.appendChild(ac);
      }else{
        const c=document.createElement("div");c.className="cap";c.textContent=tr("cap",{type:curType.n,n:it.text.length});card.appendChild(c);
      }
    }
    card.onclick=e=>{if(!e.target.closest("button"))openViewer(it);};
    out.appendChild(card);
  });
  if(!made.length&&!bad.length)out.appendChild(emptyEl());
  if(bad.length){
    const msg=(lastErr&&lastErr.nolib)?errText(lastErr)
      :(isBatch()?tr("err_skipped",{list:bad.join(", ")})+" ":"")+errText(lastErr)+" "+tr("err_fmt",{type:curType.n,hint:hint(curType)});
    $("err").textContent=msg;$("err").style.display="block";
  }
  $("cnt").textContent=isBatch()&&made.length?tr("count",{n:made.length})+(dups?" · "+tr("dup",{n:dups}):""):"";
  $("saveLbl").textContent=tr(isBatch()&&made.length>1?"save_all":"save");
}

/* ---------- Riwayat ---------- */
let hist=[];
try{hist=JSON.parse(localStorage.getItem("hist128")||"[]");}catch(e){}
hist=hist.map(h=>typeof h==="string"?{v:h,b:false,t:"code128"}:Object.assign({t:"code128"},h));
function saveHist(){try{localStorage.setItem("hist128",JSON.stringify(hist));}catch(e){}renderHist();}
function addHist(){
  const v=(isBatch()?$("b").value:$("t").value).trim();if(!v)return;
  const b=isBatch(),t=curType.id;
  hist=[{v:v,b:b,t:t}].concat(hist.filter(h=>!(h.v===v&&h.b===b&&h.t===t))).slice(0,50);saveHist();
}
function renderHist(){
  const el=$("histv");el.innerHTML="";
  if(!hist.length){
    const d=document.createElement("div");d.className="empty";
    d.innerHTML='<div class="art"><svg class="i"><use href="#i-clock"/></svg></div><h2></h2><p></p>';
    d.querySelector("h2").textContent=tr("hist_t");d.querySelector("p").textContent=tr("hist_p");
    el.appendChild(d);return;
  }
  hist.forEach((h,i)=>{
    const r=document.createElement("div");r.className="hrow";
    const o=document.createElement("button");o.className="open";
    o.innerHTML='<div class="ico"><svg class="i"><use href="#'+(h.b?"i-grid":"i-bar")+'"/></svg></div><div class="tx"><b></b><small></small></div>';
    o.querySelector("b").textContent=h.v.replace(/\s+/g," ");
    o.querySelector("small").textContent=tr(h.b?"hist_batch":"hist_single")+" · "+(TMAP[h.t]||TMAP.code128).n+" · "+tr("hist_open");
    o.onclick=()=>{
      tap();curType=TMAP[h.t]||TMAP.code128;
      if(h.b)$("b").value=h.v;else $("t").value=h.v;
      grow();setMode(h.b?"batch":"single");
    };
    const x=document.createElement("button");x.className="del";
    x.innerHTML='<svg class="i"><use href="#i-trash"/></svg>';
    x.onclick=()=>{tap();hist.splice(i,1);saveHist();};
    r.append(o,x);el.appendChild(r);
  });
  const c=document.createElement("button");c.className="clrall";c.textContent=tr("hist_clear");
  c.onclick=()=>{tap();hist=[];saveHist();};el.appendChild(c);
}

/* ---------- Jenis barcode (tampilan) ---------- */
function updateTypeUI(){
  $("typeName").textContent=curType.n;
  $("t").placeholder=tr("ph",{ex:curType.ex});
  $("b").placeholder=curType.ex+(curType.d==="2d"?"":", …");
  $("fmt").textContent=isBatch()?tr(curType.d==="2d"?"sep_2d":"sep_1d"):hint(curType);
  $("typeBtn").setAttribute("aria-label",tr("ts_title"));
}
function setType(id){curType=TMAP[id]||TMAP.code128;updateTypeUI();render();}
function setDefault(id){
  defType=id;try{localStorage.setItem("def128",id);}catch(e){}
  toast(tr("t_default",{name:TMAP[id].n}));buildTypes($("tq").value);
}
function buildTypes(q){
  const el=$("tlist");el.innerHTML="";
  q=(q||"").trim().toLowerCase();let lastG="";
  TYPES.forEach(t=>{
    const gname=tr(t.g);
    if(q&&!(t.n.toLowerCase().includes(q)||t.id.toLowerCase().includes(q)||gname.toLowerCase().includes(q)))return;
    if(t.g!==lastG){const g=document.createElement("div");g.className="tg";g.textContent=gname;el.appendChild(g);lastG=t.g;}
    const r=document.createElement("div");r.className="trow"+(t.id===curType.id?" on":"");
    const s=document.createElement("button");s.className="sel";
    const b=document.createElement("b");b.textContent=t.n;
    if(t.id===defType){const bd=document.createElement("span");bd.className="badge";bd.textContent=tr("badge");b.appendChild(bd);}
    const sm=document.createElement("small");sm.textContent=hint(t);
    s.append(b,sm);s.onclick=()=>{tap();setType(t.id);closeSheet("tsheet");};
    const st=document.createElement("button");st.className="st"+(t.id===defType?" def":"");
    st.setAttribute("aria-label",t.n+" ★");
    st.innerHTML='<svg class="i"><use href="#i-star"/></svg>';
    st.onclick=()=>{tap();setDefault(t.id);};
    r.append(s,st);el.appendChild(r);
  });
  if(!el.children.length){const d=document.createElement("div");d.className="empty";d.innerHTML="<p></p>";d.firstChild.textContent=tr("ts_none");el.appendChild(d);}
}

/* ---------- Pengaturan & bahasa ---------- */
function updateSettingsUI(){
  document.querySelectorAll("#segQ button").forEach(b=>b.classList.toggle("on",b.dataset.v===cfg.q));
  document.querySelectorAll("#segF button").forEach(b=>b.classList.toggle("on",b.dataset.v===cfg.f));
  document.querySelectorAll("#segV button").forEach(b=>b.classList.toggle("on",b.dataset.v===cfg.pv));
  $("sw").classList.toggle("on",cfg.wm!==false);
  $("langCur").textContent=cfg.lang==="auto"?tr("lang_auto")+" ("+LNAME[curLang]+")":(LNAME[cfg.lang]||"");
}
function buildLangs(){
  const el=$("llist");el.innerHTML="";
  const mkRow=(code,name,sub)=>{
    const b=document.createElement("button");b.className="lrow"+(cfg.lang===code?" on":"");
    const sp=document.createElement("span");sp.textContent=name;
    if(sub){const s=document.createElement("small");s.textContent=" "+sub;sp.appendChild(s);}
    if(code!=="auto")sp.lang=code;
    b.appendChild(sp);
    if(cfg.lang===code)b.insertAdjacentHTML("beforeend",'<svg class="i"><use href="#i-check"/></svg>');
    b.onclick=()=>{tap();cfg.lang=code;saveCfg();applyLang();closeSheet("lsheet");};
    el.appendChild(b);
  };
  mkRow("auto",tr("lang_auto"),LNAME[sysLang()]);
  LANGS.forEach(l=>mkRow(l[0],l[1]));
}

/* ---------- Kontrol ---------- */
function setMode(m){
  mode=m;document.body.dataset.mode=m;rTok++;
  document.querySelectorAll(".nav button").forEach(b=>b.classList.toggle("on",b.dataset.m===m));
  $("stage").scrollTop=0;$("toast").classList.remove("show");
  updateTypeUI();
  if(m==="hist"){$("cnt").textContent="";renderHist();}else render();
}
document.querySelectorAll(".nav button").forEach(b=>b.onclick=()=>{tap();setMode(b.dataset.m);});
function grow(){const b=$("b");b.style.height="auto";b.style.height=Math.min(b.scrollHeight,84)+"px";}
$("clear").onclick=()=>{tap();const f=isBatch()?$("b"):$("t");f.value="";grow();render();f.focus();};
$("t").addEventListener("keydown",e=>{if(e.key==="Enter"){e.preventDefault();$("t").blur();}});
$("save").onclick=()=>{tap();saveList(items);};
$("share").onclick=()=>{tap();shareFiles(isBatch()?items:items.slice(0,1));};
$("merge").onclick=()=>{tap();mergeSave();};
$("handle").onclick=()=>{tap();$("dock").classList.toggle("min");};

function openSheet(id){tap();$("toast").classList.remove("show");const s=$(id);s.classList.add("open");s.setAttribute("aria-hidden","false");}
function closeSheet(id){const s=$(id);s.classList.remove("open");s.setAttribute("aria-hidden","true");}
$("cfg").onclick=()=>{updateSettingsUI();openSheet("sheet");};
$("scrim").onclick=()=>closeSheet("sheet");$("done").onclick=()=>closeSheet("sheet");
$("typeBtn").onclick=()=>{
  $("tq").value="";buildTypes("");openSheet("tsheet");
  setTimeout(()=>{const on=$("tlist").querySelector(".trow.on");if(on)on.scrollIntoView({block:"center"});},60);
};
$("tscrim").onclick=()=>closeSheet("tsheet");
$("tq").addEventListener("input",()=>buildTypes($("tq").value));
$("goLang").onclick=()=>{buildLangs();openSheet("lsheet");};
$("lscrim").onclick=()=>closeSheet("lsheet");
$("goAbout").onclick=()=>openSheet("asheet");
$("ascrim").onclick=()=>closeSheet("asheet");$("adone").onclick=()=>closeSheet("asheet");
document.querySelectorAll("#segQ button").forEach(b=>b.onclick=()=>{tap();cfg.q=b.dataset.v;saveCfg();updateSettingsUI();});
document.querySelectorAll("#segF button").forEach(b=>b.onclick=()=>{tap();cfg.f=b.dataset.v;saveCfg();updateSettingsUI();});
document.querySelectorAll("#segV button").forEach(b=>b.onclick=()=>{tap();cfg.pv=b.dataset.v;saveCfg();updateSettingsUI();render();});
$("swRow").onclick=()=>{tap();cfg.wm=!(cfg.wm!==false);saveCfg();updateSettingsUI();render();};
$("vclose").onclick=()=>{$("viewer").classList.remove("open");};
$("vsave").onclick=()=>{tap();if(vItem)saveList([vItem]);};
$("vshare").onclick=()=>{tap();if(vItem)shareFiles([vItem]);};
["w","h"].forEach(id=>$(id).addEventListener("input",()=>{saveCfg();render();}));
$("t").addEventListener("input",render);
$("b").addEventListener("input",()=>{grow();render();});

/* ---------- Mulai ---------- */
applyLang();
window.__ready=true;
updateTypeUI();renderHist();render();buildTypes("");buildLangs();updateSettingsUI();




</script>
